<h2>Rankings</h2>

<input
  class="form-control mb-3"
  type="text"
  placeholder="Search rankings by player name"
  [(ngModel)]="searchText"
>

<p *ngIf="loading">Loading rankings...</p>
<p *ngIf="error" class="text-danger">{{ error }}</p>

<table class="table table-striped" *ngIf="filteredRankings.length > 0">
  <thead>
    <tr>
      <th>Position</th>
      <th>Player</th>
      <th>Prize Money</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let ranking of filteredRankings">
      <td>{{ ranking.Position }}</td>
      <td>{{ ranking.PlayerName }}</td>
      <td>{{ ranking.Sum }}</td>
    </tr>
  </tbody>
</table>

<p *ngIf="!loading && rankings.length > 0 && filteredRankings.length === 0">
  No rankings match your search.
</p>

<p *ngIf="!loading && rankings.length === 0">
  No rankings loaded yet.
</p>
