<h2>Rankings</h2>

<p>This page shows the current snooker money rankings from the API.</p>

<button class="btn btn-primary" type="button" (click)="loadRankings()">
  Load Rankings

@if (loading) {
  <p>Loading rankings...</p>
}

@if (error) {
  <p>{{ error }}</p>
}

@if (rankings.length > 0) {
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Position</th>
        <th>Player</th>
        <th>Prize Money</th>
      </tr>
    </thead>

    <tbody>
      @for (ranking of rankings; track ranking.ID) {
        <tr>
          <td>{{ ranking.Position }}</td>
          <td>{{ ranking.PlayerName }}</td>
          <td>{{ ranking.Sum }}</td>
        </tr>
      }
    </tbody>
  </table>
}
