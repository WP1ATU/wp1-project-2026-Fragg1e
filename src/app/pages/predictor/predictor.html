<h2>Prediction Builder</h2>

@if (error) {
  <p class="text-danger">{{ error }}</p>
}

@if (feedback) {
  <p class="text-success">{{ feedback }}</p>
}

<div class="mb-3">
  <label class="form-label">Player 1</label>
  <select title="Player 1" class="form-select" [(ngModel)]="selectedPlayerOneId">
    <option [ngValue]="0">Select player 1</option>
    @for (player of players; track player.PlayerID) {
      <option [ngValue]="player.PlayerID">
        Rank {{ player.Position }} - {{ player.PlayerName }}
      </option>
    }
  </select>
</div>

<div class="mb-3">
  <label class="form-label">Player 2</label>
  <select title="Player 2" class="form-select" [(ngModel)]="selectedPlayerTwoId">
    <option [ngValue]="0">Select player 2</option>
    @for (player of players; track player.PlayerID) {
      <option [ngValue]="player.PlayerID">
        Rank {{ player.Position }} - {{ player.PlayerName }}
      </option>
    }
  </select>
</div>

@if (selectedPlayerOneId && selectedPlayerTwoId) {
  <div class="mb-3">
    <label class="form-label">Predicted Winner</label>

    <div class="form-check">
      <input
        title="player1-check-input"
        class="form-check-input"
        type="radio"
        name="predictedWinner"
        [value]="selectedPlayerOneName"
        [(ngModel)]="predictedWinnerName"
      >
      <label class="form-check-label">
        {{ selectedPlayerOneName }}
      </label>
    </div>

    <div class="form-check">
      <input
        title="player2-check-input"
        class="form-check-input"
        type="radio"
        name="predictedWinner"
        [value]="selectedPlayerTwoName"
        [(ngModel)]="predictedWinnerName"
      >
      <label class="form-check-label">
        {{ selectedPlayerTwoName }}
      </label>
    </div>
  </div>
}

<div class="mb-3">
  <label class="form-label">Reason</label>
  <textarea
    class="form-control"
    rows="3"
    placeholder="Why do you think this player will win?"
    [(ngModel)]="reason"
  ></textarea>
</div>

<button class="btn btn-success" (click)="savePrediction()">Save Prediction</button>
<button class="btn btn-secondary" (click)="resetPrediction()">Reset</button>
