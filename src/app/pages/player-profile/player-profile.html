<h2>Player Profile</h2>

@if (error) {
  <p>{{ error }}</p>
}

@if (player) {
  <section>
    <h3>{{ player.FirstName }} {{ player.LastName }}</h3>

    @if (player.Photo) {
      <img [src]="player.Photo" alt="{{ player.FirstName }} {{ player.LastName }}" width="160">
    }

    <p>Nationality: {{ player.Nationality }}</p>
    <p>Date of birth: {{ player.Born }}</p>
    <p>Ranking titles: {{ player.NumRankingTitles }}</p>
    <p>Maximum breaks: {{ player.NumMaximums }}</p>
  </section>
}
