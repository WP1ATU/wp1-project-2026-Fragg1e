<h2>Players</h2>

<input
  class="form-control mb-3"
  type="text"
  placeholder="Search players by name"
  [(ngModel)]="searchText"
>

<p *ngIf="loading">Loading players...</p>
<p *ngIf="error" class="text-danger">{{ error }}</p>

<table class="table table-striped" *ngIf="filteredPlayers.length > 0">
  <thead>
    <tr>
      <th>Name</th>
      <th>Nationality</th>
      <th>
      <button class="btn btn-link p-0" (click)="sortPlayers('titles')">
        Ranking Titles
      </button>
    </th>
    <th>
      <button class="btn btn-link p-0" (click)="sortPlayers('maximums')">
        Maximum Breaks
      </button>
    </th>
          <th>Profile</th>
        </tr>
  </thead>

  <tbody>
    <tr *ngFor="let player of filteredPlayers">
      <td>{{ player.FirstName }} {{ player.LastName }}</td>
      <td>{{ player.Nationality }}</td>
      <td>{{ player.NumRankingTitles }}</td>
      <td>{{ player.NumMaximums }}</td>
      <td>
        <a class="btn btn-sm btn-secondary" [routerLink]="['/players', player.ID]">
          View
        </a>
      </td>
    </tr>
  </tbody>
</table>

<p *ngIf="!loading && players.length > 0 && filteredPlayers.length === 0">
  No players match your search.
</p>

<p *ngIf="!loading && players.length === 0">
  No players loaded yet.
</p>
